<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Match ou Miojo?</title>
  <link rel="stylesheet" href="css/estilo-base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="container">
    <h1 class="logo">Match ou Miojo?</h1>
    <p class="subtitulo">Entre para ver quem está de bobeira por aí</p>

    <form id="formLogin">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="voce@email.com">

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Sua senha">

      <p id="mensagem" class="mensagem"></p>

      <button type="submit" class="botao">Entrar</button>
    </form>

    <p class="link-troca">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
