<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Match ou Miojo?</title>
  <link rel="stylesheet" href="css/estilo-base.css">
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>
  <main class="container">
    <h1 class="logo">Match ou Miojo?</h1>
    <p class="subtitulo">Crie seu perfil e encontre alguém (ou pelo menos um jantar)</p>

    <form id="formCadastro">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome">

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="voce@email.com">

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Mínimo de 4 caracteres">

      <div class="linha">
        <div>
          <label for="idade">Idade</label>
          <input type="number" id="idade" name="idade" placeholder="18+">
        </div>
        <div>
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" placeholder="Sua cidade">
        </div>
      </div>

      <label for="cantada">Sua cantada</label>
      <input type="text" id="cantada" name="cantada" placeholder="Capricha na frase!">

      <label for="defeito">Seu defeito (opcional)</label>
      <input type="text" id="defeito" name="defeito" placeholder="Seja sincero(a)">

      <p id="mensagem" class="mensagem"></p>

      <button type="submit" class="botao">Cadastrar</button>
    </form>

    <p class="link-troca">Já tem conta? <a href="login.html">Entrar</a></p>
  </main>

  <script type="module" src="js/cadastro.js"></script>
</body>
</html>
